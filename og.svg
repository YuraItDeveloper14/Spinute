<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ec"/>
      <stop offset="1" stop-color="#e6f0ef"/>
    </linearGradient>
    <radialGradient id="glow1" cx="12%" cy="0%" r="60%">
      <stop offset="0" stop-color="#cfe6cf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfe6cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0" stop-color="#cfe6e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfe6e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- spinach leaf mascot -->
  <g transform="translate(910 315)">
    <g transform="scale(9)">
      <path d="M0 -16C15 -8 20 6 0 30C-20 6 -15 -8 0 -16Z" fill="#3a7a54"/>
      <path d="M0 -12 V 18 M0 -4 L 9 -10 M0 2 L -9 -4 M0 8 L 8 3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>
      <circle cx="-4" cy="4" r="1.9" fill="#fff"/>
      <circle cx="4" cy="4" r="1.9" fill="#fff"/>
      <circle cx="-3.7" cy="4.4" r="0.85" fill="#1f2d26"/>
      <circle cx="4.3" cy="4.4" r="0.85" fill="#1f2d26"/>
      <path d="M-4 8.4 Q0 11.6 4 8.4" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="96" y="292" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="132" fill="#20302a">Spinute<tspan fill="#2f6b4c">.</tspan></text>
  <text x="100" y="366" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#3a6b8a">speak</text>
  <text x="236" y="366" font-family="Georgia, serif" font-size="40" fill="#6b7a73">+</text>
  <text x="272" y="366" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#2f6b4c">minute</text>
  <text x="100" y="452" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#42504a">One random topic. One minute to speak.</text>
  <text x="100" y="498" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#42504a">Instant analysis and an approximate CEFR level.</text>

  <text x="100" y="566" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#2f6b4c">spinute.vercel.app</text>
</svg>
